name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Placeholder values so the build/prerender doesn't fail on missing config.
    # Real secrets live in Vercel, never in CI.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://dmaths.academy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Errors fail the build; the existing warning backlog is visible but doesn't
      # block. The error-level rules are the accessibility ones — a control that
      # loses its label can't reach main unnoticed.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # A teacher and a learner in two real browsers: writing must reach both
      # sides on a normal, a lossy and a dead live connection; PDF slides must
      # upload on a flaky connection; and "Check my class" must report
      # correctly. Supabase is played by the tests, so no secrets are needed.
      - name: Install browser for live-class tests
        run: npx playwright install --with-deps chromium

      - name: Live class & upload tests
        run: npm run e2e

      - name: Keep the test report if they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
